<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Search App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
    *{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#0f172a;
  min-height:100vh;
  color:white;
}

.container{
  width:90%;
  max-width:1200px;
  margin:auto;
  padding:40px 0;
}

h1{
  text-align:center;
  font-size:3rem;
  margin-bottom:10px;
}

.tagline{
  text-align:center;
  color:#94a3b8;
  margin-bottom:30px;
}

.search-box{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-bottom:30px;
  flex-wrap:wrap;
}

.search-box input{
  width:320px;
  padding:14px;
  border:none;
  border-radius:12px;
  outline:none;
  background:#1e293b;
  color:white;
  font-size:16px;
}

.search-box input::placeholder{
  color:#94a3b8;
}

.search-box button{
  padding:14px 22px;
  border:none;
  border-radius:12px;
  background:linear-gradient(to right,#38bdf8,#818cf8);
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}

.search-box button:hover{
  transform:scale(1.05);
}

#message{
  text-align:center;
  margin-bottom:20px;
  color:#facc15;
}
#loader{
  width:150px;
  height:150px;
  border:12px solid #334155;
  border-top:12px solid rgb(185, 6, 208);
  border-radius:50%;
  margin:20px auto;
  animation:spin 1s linear infinite;
  box-shadow:0 0 30px rgb(181, 43, 200);
  display:none;
}
@keyframes spin{
  100%{
    transform:rotate(360deg);
  }
}

#movies{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:25px;
}

.movie-card{
  background:#1e293b;
  border-radius:16px;
  overflow:hidden;
  transition:0.3s;
  box-shadow:0 5px 15px rgba(0,0,0,0.3);
}

.movie-card:hover{
  transform:translateY(-8px);
}

.movie-card img{
  width:100%;
  height:320px;
  object-fit:cover;
}

.movie-info{
  padding:15px;
}

.movie-info h2{
  font-size:20px;
  margin-bottom:10px;
}

.movie-info p{
  color:#cbd5e1;
  margin-bottom:6px;
}

.rating{
  display:inline-block;
  margin-top:10px;
  padding:6px 12px;
  border-radius:20px;
  background:#0f172a;
  color:#38bdf8;
  font-size:14px;
}

.loadbtn{
  padding:14px 22px;
  border:none;
  border-radius:12px;
  background:linear-gradient(to right,#38bdf8,#818cf8);
  color:white;
  font-size:16px;
  cursor:pointer;
  transition:0.3s;
}
.loadbtn:hover{
  transform:scale(1.04);
}

</style>

  <div class="container">

    <h1>🎬 MovieVerse</h1>
    <p class="tagline">Search your favourite movies instantly</p>

    <!-- Search Area -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search movies...">
      <button id="searchBtn">Search</button>
    </div>

    <div id="loader"></div>
    <!-- Message -->
    <p id="message">
    </p>

    <!-- Movies Container -->
  <div id="movies"> 
  </div>
  <button id="loadbtn" class="loadbtn">Load more</button>
</div>
  <script src="movie.js"></script>
</body>
</html>
